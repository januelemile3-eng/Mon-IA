<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon IA">
<meta name="theme-color" content="#0f1a1c">
<title>Mon IA</title>
<style>
:root{
  --bg:#0f1a1c; --panel:#162427; --line:#25393d; --text:#e8efe9; --muted:#8fa5a3;
  --accent:#7fd1b9; --accent-ink:#06201a; --user:#1d3a3a; --danger:#e58a8a;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f6f4; --panel:#ffffff; --line:#d5e0dc; --text:#13211f; --muted:#5d7270;
    --accent:#1d7a63; --accent-ink:#ffffff; --user:#dcebe5; --danger:#b23a3a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font:600 18px ui-serif,Georgia,serif;margin:0;letter-spacing:.2px}
header .btns{display:flex;gap:8px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;font-family:ui-serif,Georgia,serif;line-height:1.55}
.msg.err{border-color:var(--danger);color:var(--danger);font-family:inherit}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch}
.empty b{display:block;color:var(--text);font:600 20px ui-serif,Georgia,serif;margin-bottom:6px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
textarea#input{flex:1;resize:none;max-height:140px;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
#panel{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#panel.open{display:block}
#panel h2{font:600 22px ui-serif,Georgia,serif;margin:0 0 4px}
label{display:block;margin:16px 0 6px;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:0 0 6px}
input,select,textarea.field{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.field{min-height:220px;resize:vertical}
.row{display:flex;gap:8px;margin-top:20px}
.row button{flex:1}
</style>
</head>
<body>
<header>
  <h1>Mon IA</h1>
  <div class="btns">
    <button id="newBtn" type="button">Effacer</button>
    <button id="setBtn" type="button">Réglages</button>
  </div>
</header>

<main id="chat" aria-live="polite"></main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Écris ton message" enterkeyhint="send"></textarea>
  <button class="primary" id="send" type="submit">Envoyer</button>
</form>

<section id="panel" aria-label="Réglages">
  <h2>Réglages</h2>
  <p class="hint">Tout reste enregistré sur ton iPhone uniquement.</p>

  <label for="provider">Service</label>
  <select id="provider">
    <option value="groq">Groq</option>
    <option value="openrouter">OpenRouter</option>
  </select>

  <label for="key">Clé API</label>
  <p class="hint">Gratuite : console.groq.com ou openrouter.ai/keys</p>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gsk_… ou sk-or-…">

  <label for="model">Modèle</label>
  <p class="hint">Les noms changent parfois : vérifie la liste sur le site du service.</p>
  <input id="model" autocapitalize="off" spellcheck="false">

  <label for="rules">Tes règles et ton éthique</label>
  <p class="hint">Envoyées à l’IA avant chaque conversation. Écris tes valeurs, ce qu’elle accepte, refuse, son ton, sa langue.</p>
  <textarea id="rules" class="field"></textarea>

  <label for="temp">Créativité : <span id="tempVal"></span></label>
  <input id="temp" type="range" min="0" max="1.2" step="0.1">

  <div class="row">
    <button id="close" class="primary" type="button">Enregistrer</button>
  </div>
</section>

<script>
(function(){
  var PROVIDERS = {
    groq: {url:"https://api.groq.com/openai/v1/chat/completions", model:"llama-3.3-70b-versatile"},
    openrouter: {url:"https://openrouter.ai/api/v1/chat/completions", model:"meta-llama/llama-3.3-70b-instruct:free"}
  };
  var DEFAULT_RULES = "Tu es mon assistant personnel. Tu réponds en français, de façon directe et honnête.\n\nMes valeurs et mes règles :\n- (écris ici ta propre éthique)\n- (ce que tu acceptes de faire)\n- (ce que tu refuses de faire)\n\nSi tu n’es pas sûr d’une information, dis-le au lieu d’inventer.";

  function load(k, d){ try{ var v = localStorage.getItem(k); return v===null ? d : v; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var chat=$("chat"), input=$("input"), panel=$("panel");
  var history = [];
  try{ history = JSON.parse(load("history","[]")) || []; }catch(e){ history = []; }
  var busy = false;

  var cfg = {
    provider: load("provider","groq"),
    key: load("key",""),
    model: load("model",""),
    rules: load("rules", DEFAULT_RULES),
    temp: load("temp","0.7")
  };

  function fillPanel(){
    $("provider").value = cfg.provider;
    $("key").value = cfg.key;
    $("model").value = cfg.model || PROVIDERS[cfg.provider].model;
    $("rules").value = cfg.rules;
    $("temp").value = cfg.temp;
    $("tempVal").textContent = cfg.temp;
  }

  function render(){
    chat.innerHTML = "";
    if(!history.length){
      var e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "<b>Prête quand tu l’es.</b>Ouvre les réglages pour coller ta clé API et écrire tes règles.";
      chat.appendChild(e);
      return;
    }
    history.forEach(function(m){ addBubble(m.role==="user"?"user":"ai", m.content); });
    chat.scrollTop = chat.scrollHeight;
  }

  function addBubble(kind, text){
    var d = document.createElement("div");
    d.className = "msg " + kind;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function openPanel(){ fillPanel(); panel.classList.add("open"); }
  function closePanel(){
    cfg.provider = $("provider").value;
    cfg.key = $("key").value.trim();
    cfg.model = $("model").value.trim();
    cfg.rules = $("rules").value;
    cfg.temp = $("temp").value;
    ["provider","key","model","rules","temp"].forEach(function(k){ save(k, cfg[k]); });
    panel.classList.remove("open");
  }

  $("setBtn").onclick = openPanel;
  $("close").onclick = closePanel;
  $("provider").onchange = function(){ $("model").value = PROVIDERS[$("provider").value].model; };
  $("temp").oninput = function(){ $("tempVal").textContent = $("temp").value; };
  $("newBtn").onclick = function(){
    if(busy) return;
    history = []; save("history","[]"); render();
  };

  input.addEventListener("input", function(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  $("form").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var text = input.value.trim();
    if(!text || busy) return;
    if(!cfg.key){ openPanel(); return; }

    if(!history.length) chat.innerHTML = "";
    history.push({role:"user", content:text});
    addBubble("user", text);
    input.value = ""; input.style.height = "auto";

    var bubble = addBubble("ai", "…");
    busy = true; $("send").disabled = true;

    var p = PROVIDERS[cfg.provider] || PROVIDERS.groq;
    var messages = [{role:"system", content:cfg.rules}].concat(history);
    var full = "";

    try{
      var res = await fetch(p.url, {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
        body: JSON.stringify({
          model: cfg.model || p.model,
          messages: messages,
          temperature: parseFloat(cfg.temp),
          stream: true
        })
      });
      if(!res.ok){
        var errTxt = await res.text();
        throw new Error("Erreur " + res.status + " : " + errTxt.slice(0,300));
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = "";
      while(true){
        var r = await reader.read();
        if(r.done) break;
        buf += dec.decode(r.value, {stream:true});
        var lines = buf.split("\n");
        buf = lines.pop();
        for(var i=0;i<lines.length;i++){
          var l = lines[i].trim();
          if(l.indexOf("data:") !== 0) continue;
          var data = l.slice(5).trim();
          if(data === "[DONE]") continue;
          try{
            var j = JSON.parse(data);
            var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if(delta){ full += delta; bubble.textContent = full; chat.scrollTop = chat.scrollHeight; }
          }catch(e){}
        }
      }
      if(!full) throw new Error("Réponse vide. Vérifie le nom du modèle dans les réglages.");
      history.push({role:"assistant", content:full});
      save("history", JSON.stringify(history.slice(-40)));
    }catch(err){
      bubble.className = "msg ai err";
      bubble.textContent = err.message;
      history.pop();
    }
    busy = false; $("send").disabled = false;
  });

  render();
  if(!cfg.key) openPanel();
})();
</script>
</body>
</html>
